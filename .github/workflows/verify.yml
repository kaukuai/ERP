name: Verify ERP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Syntax and full test suite
        run: npm run verify

  browser:
    name: Browser forms, approvals and layout
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/erp-browser-tools" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/erp-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build and exercise packaged demo with three workers
        env:
          NODE_PATH: ${{ runner.temp }}/erp-browser-tools/node_modules
          ERP_BROWSER_OUTPUT: ${{ runner.temp }}/erp-browser-results
        run: |
          node scripts/build-vercel.mjs
          node scripts/check-browser-demo.cjs tests/browser-document-layout.cjs tests/browser-regression.cjs tests/browser-governance.cjs tests/browser-forms.cjs tests/browser-controls.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ERP-browser-checks
          path: ${{ runner.temp }}/erp-browser-results/
          if-no-files-found: ignore
          retention-days: 7

  windows-package:
    name: Windows local package
    needs: [verify, browser]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build package with bundled Node runtime
        run: npm run package:local
      - name: Verify persistence, upgrade backups and isolated companies
        run: node scripts/check-local-package.mjs
      - name: Upload downloadable Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ERP-Windows
          path: artifacts/local/ERP-local/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
