name: Verify ERP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Syntax and full test suite
        run: npm run verify

  windows-package:
    name: Windows local package
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Build package with bundled Node runtime
        run: npm run package:local
      - name: Verify persistence, upgrade backups and isolated companies
        run: node scripts/check-local-package.mjs
      - name: Upload downloadable Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ERP-Windows
          path: artifacts/local/ERP-local/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
